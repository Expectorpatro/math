[project]
name = "textbook-python"
version = "0.1.0"
description = "Shared Python environment for textbook computations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deap>=1.4.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "simanneal>=0.5.0",
    "xgboost>=3.4.0",
]

[tool.uv]
package = false
